<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Circle - Fast & Secure Messaging</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0C1014; color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .container { max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .logo-box { width: 90px; height: 90px; background: #1AB394; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(26, 179, 148, 0.3); }
        .logo-box svg { width: 50px; height: 50px; fill: #0C1014; }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
        p { color: #8E9297; font-size: 16px; line-height: 1.6; margin-bottom: 36px; }
        .btn-download { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 320px; padding: 16px 28px; background: #1AB394; color: #FFFFFF; font-size: 17px; font-weight: 700; border-radius: 30px; text-decoration: none; transition: 0.2s; box-shadow: 0 4px 20px rgba(26, 179, 148, 0.4); }
        .btn-download:hover { background: #159b7f; transform: scale(1.02); }
        .security-badge { margin-top: 40px; display: flex; align-items: center; gap: 8px; color: #FFD279; font-size: 13px; background: #1F1A12; padding: 10px 18px; border-radius: 20px; border: 1px solid rgba(255, 210, 121, 0.2); }
        .footer { margin-top: auto; padding-top: 40px; color: #6B7280; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">
            <svg viewBox="0 0 24 24"><path d="M20,2H4C2.9,2 2,2.9 2,4v18l4-4h14c1.1,0 2-0.9 2-2V4C22,2.9 21.1,2 20,2z"/></svg>
        </div>
        <h1>Friend Circle</h1>
        <p>Fast, simple, secure messaging and calling with end-to-end encryption. Stay connected with your friends anytime, anywhere.</p>
        <a href="#download" class="btn-download">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
            Download Android App
        </a>
        <div class="security-badge">
            🔒 End-to-End Encrypted Messaging
        </div>
    </div>
    <div class="footer">
        &copy; 2026 Friend Circle. Built by Dev. Nur
    </div>
</body>
</html>
